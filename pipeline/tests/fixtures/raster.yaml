# yaml-language-server: $schema=../../schema/layer.schema.json
#
# The raster layer of tests/raster.bats: a binary GeoTIFF made at test time
# (make_raster.sh), z3 to z8. Built as `cover` with the test layers, it is
# part of expected_style.json, which the web app's tests read too.

title: Test raster
visible: true
order: 5

source:
  path: cover.tif

processing:
  profile: raster
  minzoom: 3
  maxzoom: 8

display:
  layers:
    - id: raster
      type: color-relief
      paint:
        color-relief-color:
          [interpolate, [linear], [elevation], 0, "rgba(27, 120, 55, 0)", 255, "rgba(27, 120, 55, 1)"]
        color-relief-opacity: 0.7
        resampling: nearest
  legend:
    kind: single
    shape: square
    border: transparent
    opacity: 0.7
    items:
      - { color: "#1b7837", label: Test raster }
