# yaml-language-server: $schema=../../schema/layer.schema.json
#
# A minimal vector layer for the tests: tests/helpers.bash (layer_file)
# copies it and changes it with yq. One colour, no pop-up.

title: Test layer
visible: true

source:
  path: /opt/pipeline/tests/fixtures/sample.geojson
  id: id

processing:
  profile: default
  minzoom: 0
  maxzoom: 4

display:
  layers:
    - id: fill
      type: fill
      paint:
        fill-color: "#2c7fb8"
        fill-opacity: 0.7
    - id: outline
      type: line
      paint:
        line-color: "#ffffff"
        line-width: 0.5
  legend:
    kind: single
    shape: square
    border: "#ffffff"
    opacity: 0.7
    items:
      - { color: "#2c7fb8", label: Test layer }
