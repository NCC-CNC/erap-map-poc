# yaml-language-server: $schema=../../schema/layer.schema.json
#
# The synthetic test layer: made-up polygons, no real data. Not built by a
# default run; the fixture ships in the pipeline image.

title: Sample polygons
visible: true
order: 10

source:
  path: /opt/pipeline/tests/fixtures/sample.geojson
  id: id

# `notes` in the fixture is dropped.
fields:
  keep:
    NAME_EN: name
    area_ha: area_ha
    score: score
    v2020: v2020
    v2021: v2021
    v2022: v2022
    v2023: v2023
    v2024: v2024

# These polygons do not touch, so not a coverage.
processing:
  profile: default
  minzoom: 0
  maxzoom: 8

display:
  layers:
    - id: fill
      type: fill
      paint:
        fill-color:
          [case, ["==", [typeof, [get, score]], number],
           [step, [get, score], "#a1dab4", 25, "#41b6c4", 50, "#2c7fb8", 75, "#253494"],
           "#9e9e9e"]
        fill-opacity: 0.7
    - id: outline
      type: line
      paint:
        line-color: "#ffffff"
        line-width: 0.75
  legend:
    kind: ramp
    shape: square
    border: "#ffffff"
    opacity: 0.7
    items:
      - { color: "#a1dab4", label: 0 to 25 }
      - { color: "#41b6c4", label: 25 to 50 }
      - { color: "#2c7fb8", label: 50 to 75 }
      - { color: "#253494", label: 75 to 100 }
      - { color: "#9e9e9e", label: No score }
  popup:
    title: { attribute: name }
    stats:
      - { label: ID, value: { featureId: true } }
      - { label: Area, value: { attribute: area_ha }, format: { decimals: 1, suffix: ha } }
      - { label: Score, value: { attribute: score }, format: { suffix: / 100 } }
    charts:
      - type: bar
        title: Value by year
        valueLabel: Value
        points:
          - { label: "2020", attribute: v2020 }
          - { label: "2021", attribute: v2021 }
          - { label: "2022", attribute: v2022 }
          - { label: "2023", attribute: v2023 }
          - { label: "2024", attribute: v2024 }
