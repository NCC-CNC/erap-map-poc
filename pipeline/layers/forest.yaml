# yaml-language-server: $schema=../schema/layer.schema.json
#
# Forest cover, a binary 30 m raster over Canada (AAFC land use 2020 and
# NFIS 2022). Byte, 1 = forest, nodata 255 (declared in the file).

title: Forest
visible: false
order: 1

source:
  path: Forest_AAFC_LUTS_2020_NFIS_2022_30m.tif

processing:
  profile: raster
  minzoom: 2
  # About 20 to 27 m across Canada, close to the 30 m source; the map
  # overzooms past it.
  maxzoom: 12

# The COG holds the share of each pixel that is forest, 0 to 255; the map
# colours it, from transparent to the full colour.
display:
  layers:
    - id: raster
      type: color-relief
      paint:
        color-relief-color:
          [interpolate, [linear], [elevation], 0, "rgba(27, 120, 55, 0)", 255, "rgba(27, 120, 55, 1)"]
        color-relief-opacity: 0.7
        resampling: nearest
  legend:
    kind: single
    shape: square
    border: transparent
    opacity: 0.7
    items:
      - { color: "#1b7837", label: Forest (2020 to 2022) }
