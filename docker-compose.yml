# ERAP Map PoC stack (ADR 0004). Usage is in README.md; the design is in
# docs/design/01_architecture.md (Docker Compose section).
#
#   docker compose run --rm pipeline [layer ...]   build tiles into data/tiles/
#   docker compose run --rm pipeline --status      what is built, what is stale
#   docker compose run --rm pipeline-pages         the GitHub Pages copy, data/pages/
#   docker compose up -d web                       map at http://localhost:8080
#   docker compose --profile dev up web-dev        Vite dev server on :5173
#   docker compose --profile pages up -d web-pages the Pages copy (data/pages/) on :8081
#
# Variables come from the shell or the git-ignored .env (see .env.example);
# every one has a default, so .env is optional.

name: erap-map

services:
  # nginx serving the built app and the pipeline output (web/Dockerfile).
  web: &web
    build:
      context: ./web
    image: natureconservancy/erap-map-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./data/tiles:/srv/tiles:ro
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # busybox wget ships with the alpine nginx image.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # The GitHub Pages copy in data/pages/ (ADR 0014), served like `web` on
  # its own port, to check a pipeline-pages build before publishing it or
  # to run it next to the full local map. Same image and settings as `web`
  # (the YAML merge replaces ports and volumes whole).
  web-pages:
    <<: *web
    profiles: [pages]
    ports:
      - "${WEB_PAGES_PORT:-8081}:8080"
    volumes:
      - ./data/pages:/srv/tiles:ro

  # Tile builder, run on demand: `docker compose run --rm pipeline [layer ...]`.
  pipeline:
    build:
      context: ./pipeline
      target: runtime
    image: natureconservancy/erap-map-pipeline
    profiles: [pipeline]
    # On Linux, set PIPELINE_UID/PIPELINE_GID to your own (`id -u`, `id -g`)
    # so the tiles in data/tiles/ are owned by you. Docker Desktop (Windows,
    # macOS) maps bind mount ownership itself, so the default is fine there.
    user: "${PIPELINE_UID:-10001}:${PIPELINE_GID:-10001}"
    volumes:
      # Source data, read only. RAW_DIR points it at a folder outside the
      # repo (for example a shared data drive); the default is data/raw/.
      - ${RAW_DIR:-./data/raw}:/data/raw:ro
      - ./data/tiles:/data/tiles
      # Work dir kept between runs: raster sources prepared once (tiled
      # 0/1 GeoTIFFs, about 0.1 GB per Canada-wide 30 m layer), reused
      # until the source changes. Safe to delete. See pipeline/lib/raster.sh.
      - ./data/work:/data/work
      # The layer files (<layer>.yaml) from the repo, so editing a layer
      # needs no image rebuild: rerun the pipeline and reload the map.
      - ./pipeline/layers:/opt/pipeline/layers:ro
      # The repo, read only, for your map config (map.config.yaml,
      # git-ignored, design note 04).
      # The folder rather than the file: a bind mount of a missing file
      # would make a directory in its place, and the config is optional.
      - .:/repo:ro
    environment:
      # MAP_CONFIG (in .env) picks another config file, relative to the
      # repo root. No file there means every layer, as it is.
      PIPELINE_MAP_CONFIG: /repo/${MAP_CONFIG:-map.config.yaml}

  # The GitHub Pages copy (ADR 0014): the pipeline with the committed
  # map.pages.yaml (smaller rasters, the public protected areas source,
  # which it requires) into data/pages/, never data/tiles/. MAP_CONFIG
  # and your map.config.yaml are not read. The raster work dir is shared,
  # so prepared sources are reused. Run on demand: `docker compose run
  # --rm pipeline-pages [layer ...]`, then scripts/publish-pages.sh.
  pipeline-pages:
    extends:
      service: pipeline
    volumes:
      # Replaces the data/tiles mount (volumes merge by container path).
      - ./data/pages:/data/tiles
    environment:
      PIPELINE_MAP_CONFIG: /repo/map.pages.yaml

  # Frontend development: Vite with hot reload on http://localhost:5173,
  # serving data/tiles/ at /tiles/ like the web image.
  web-dev:
    image: node:26.13.1-bookworm-slim@sha256:5df79989ed685e09f0a98019db4cebfb22fb9df1a53c0161664a011f7ff6b0f1
    profiles: [dev]
    working_dir: /repo/web
    # npm ci runs only when package-lock.json differs from the last install
    # into the node_modules volume.
    command:
      - sh
      - -c
      - >-
        cmp -s package-lock.json node_modules/.compose-lock 2>/dev/null
        || { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.compose-lock; }
        && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "${WEB_DEV_PORT:-5173}:5173"
    environment:
      # File change events do not reach containers from Windows bind mounts,
      # so web/vite.config.ts polls when this is set. Set to 0 to turn off.
      VITE_USE_POLLING: ${VITE_USE_POLLING:-1}
    volumes:
      - ./web:/repo/web
      # Linux node_modules, kept apart from any host install.
      - web-dev-node-modules:/repo/web/node_modules
      # Same layout as the repo, so vite.config.ts finds ../data/tiles.
      - ./data/tiles:/repo/data/tiles:ro
      # The web tests read the style.json the pipeline writes for the test
      # layers (pipeline/tests/fixtures), the ecoregions themes and modal,
      # and the schemas (the layer file types, web/vite/layerTypes.ts) from
      # ../pipeline (web/src/test/fixtures.ts).
      - ./pipeline/schema:/repo/pipeline/schema:ro
      - ./pipeline/tests/fixtures:/repo/pipeline/tests/fixtures:ro

volumes:
  web-dev-node-modules:
