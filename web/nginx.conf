# nginx server for the ERAP Map web app (ADR 0004). Installed as
# /etc/nginx/conf.d/default.conf in web/Dockerfile.
#
#   /             the built app; app routes fall back to index.html
#   /assets/      hashed Vite assets, cached for a year
#   /tiles/       pipeline output, mounted read-only at /srv/tiles
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text assets. .pmtiles is not listed, and /tiles/ turns gzip
    # off, so range requests on archives always get raw bytes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # PMTiles archives, manifest.json and style.json from the pipeline.
    # nginx serves byte ranges for static files by default. no-cache plus
    # the default ETag and Last-Modified headers makes the browser
    # revalidate, so a reload picks up a rebuilt layer or a `pipeline
    # --style-only` update (scripts/check-tiles-cache.sh, run in the CI
    # smoke test, checks this). Missing files are a plain 404, never
    # index.html.
    location ^~ /tiles/ {
        alias /srv/tiles/;
        autoindex off;
        gzip off;

        types {
            application/vnd.pmtiles pmtiles;
            application/json        json;
        }
        default_type application/octet-stream;

        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;

        # No index file and no listing for /tiles/ itself.
        location = /tiles/ {
            return 404;
        }
    }

    # Vite puts a content hash in every file name under /assets/.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # The MapLibre worker is an ES module (.mjs), which the stock
        # mime.types does not list; browsers refuse a module worker served
        # as application/octet-stream (#26). The empty types block only
        # applies here, so other assets keep the full MIME map. A nested
        # location that sets add_header does not inherit the ones above, so
        # they are repeated.
        location ~* \.mjs$ {
            try_files $uri =404;
            types { }
            default_type application/javascript;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # Anything that looks like a file (has an extension) is served as is
    # or is a 404, so a missing script or icon never gets index.html.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # App routes: fall back to index.html. no-cache so a new build's
    # index.html (and its new asset hashes) is picked up straight away.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
