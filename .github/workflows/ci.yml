name: CI

# PRs only: with strict branch protection every PR is tested against current
# main before it merges, so a run on push to main would test the same code
# again. If you do not use strict protection, add this back under `on:` so a
# fresh repo gets a first run:
#   push:
#     branches: [main]
on:
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Layout:
# - changes: says whether the PR touches anything besides docs and Markdown.
# - repo-hygiene: stack-neutral checks, always runs.
# - your own jobs: add them with the `needs`/`if` lines of the example below,
#   so a docs-only PR skips them and clears in seconds.
# - checks: the one required status check. It passes when every job it needs
#   passed or was skipped. Branch protection names only this job, so adding or
#   renaming a stack job never means touching the protection rules.
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qvE '^docs/|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Example stack job, to copy once the stack is chosen. Add its name to the
  # `needs` list of `checks` below.
  #
  # build:
  #   needs: changes
  #   if: needs.changes.outputs.code == 'true'
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     # Setup, install, then format/lint/typecheck/test/build for your stack.
  #     #
  #     # Caching a slow-to-fetch dependency or tool: restore it with
  #     # actions/cache and a key from your lockfile. A PR can read caches
  #     # saved on main but not caches saved by another PR, so also add
  #     # a matching step to warm-cache.yml with the same key.
  #     - uses: actions/cache@v6
  #       with:
  #         path: PATH_TO_CACHE
  #         key: cache-${{ runner.os }}-${{ hashFiles('LOCKFILE') }}
  #     - run: YOUR_BUILD_AND_TEST_COMMAND

  # Stack jobs. Docker builds use the GitHub Actions cache (type=gha), one
  # scope per image, with mode=max so intermediate stages (the slow
  # tippecanoe build) are cached too. warm-cache.yml writes the same scopes
  # from main, so a new PR starts warm. The gha cache backend authenticates
  # with the runner's own cache token, so no extra `permissions:` are needed.

  # Pipeline: shellcheck and hadolint, then the bats tests in the `test`
  # image, then the `runtime` image (the default target).
  pipeline:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck and hadolint
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict -
          tar -xJf shellcheck.tar.xz --strip-components=1 -C bin "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          curl -fsSL -o bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  bin/hadolint" | sha256sum --check --strict -
          chmod +x bin/hadolint
          rm shellcheck.tar.xz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x pipeline/bin/*.sh pipeline/lib/*.sh pipeline/layers/*.env \
            pipeline/tests/fixtures/*.sh pipeline/tests/*.bats scripts/screenshot.sh \
            scripts/setup.sh scripts/tests/*.bats

      - name: hadolint
        run: hadolint --config .hadolint.yaml pipeline/Dockerfile

      - uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: pipeline
          target: test
          load: true
          tags: erap-map-pipeline:test
          cache-from: type=gha,scope=pipeline
          cache-to: type=gha,scope=pipeline,mode=max

      - name: bats
        run: docker run --rm erap-map-pipeline:test

      # scripts/setup.sh, with stub docker, wsl.exe and friends (no Windows
      # needed), in the same image for its bats.
      - name: bats (scripts)
        run: docker run --rm -v "$PWD":/repo:ro erap-map-pipeline:test /repo/scripts/tests

      # Shares every stage with the test image, so this is a cache hit.
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: pipeline
          target: runtime
          tags: erap-map-pipeline:ci
          cache-from: type=gha,scope=pipeline

  # Web: lint, typecheck, test and build with npm, then hadolint and the
  # nginx image, with a smoke test of the running container.
  web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Same Node as web/Dockerfile and the web-dev compose service.
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Runtime dependencies only: the known moderate findings are dev-only
      # (eslint toolchain) and nothing from them ships in the bundle.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: hadolint
        env:
          HADOLINT_VERSION: 2.15.1
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          curl -fsSL -o "$RUNNER_TEMP/hadolint" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  $RUNNER_TEMP/hadolint" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/hadolint"
          "$RUNNER_TEMP/hadolint" --config ../.hadolint.yaml Dockerfile

      - uses: docker/setup-buildx-action@v4

      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: web
          load: true
          tags: erap-map-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Smoke test the web image
        run: |
          docker run -d --name web -p 8080:8080 --read-only --tmpfs /tmp erap-map-web:ci
          base=http://127.0.0.1:8080
          ok=
          for _ in $(seq 1 20); do
            if curl -fsS -o "$RUNNER_TEMP/index.html" "$base/"; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then docker logs web; exit 1; fi
          grep -qi '<!doctype html>' "$RUNNER_TEMP/index.html"
          # The app bundle names the hashed MapLibre worker (#26); it must be
          # served as JavaScript or the module worker will not load.
          app_js=$(grep -o '/assets/index-[^"]*\.js' "$RUNNER_TEMP/index.html" | head -n 1)
          echo "app bundle: $app_js"
          test -n "$app_js"
          worker=$(curl -fsS "$base$app_js" | grep -o 'assets/maplibre-gl-worker-[A-Za-z0-9_-]*\.mjs' | head -n 1)
          echo "worker: $worker"
          test -n "$worker"
          curl -fsS -o /dev/null -D "$RUNNER_TEMP/worker.headers" "$base/$worker"
          cat "$RUNNER_TEMP/worker.headers"
          grep -qi '^content-type: application/javascript' "$RUNNER_TEMP/worker.headers"
          docker rm -f web

  # Compose: the file and every profile resolve.
  compose:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - run: docker compose version
      - run: docker compose config -q
      - run: docker compose --profile pipeline --profile dev config -q

  checks:
    needs: [changes, repo-hygiene, pipeline, web, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in
            *failure*|*cancelled*) exit 1 ;;
          esac

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow files
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz

      - name: Lint markdown
        run: npx --yes markdownlint-cli '**/*.md' --ignore node_modules --ignore LICENSE

      - name: No em dashes in tracked text
        run: |
          if git grep -In $'\xe2\x80\x94' -- . ':!LICENSE'; then
            echo "Em dash found. See CLAUDE.md: no em dashes in code, comments, docs, or commit messages." >&2
            exit 1
          fi

      - name: Docs structure present
        run: |
          test -f CLAUDE.md
          test -f docs/decisions/README.md
          test -f docs/handoffs/HANDOFF_TEMPLATE.md
          test -d docs/design
