name: Pages

# Deploys the GitHub Pages copy of the map (ADR 0014): builds the web app
# under the site's base path (/erap-map-poc/) and serves it with the map
# data from a release (`pages-data`), which scripts/publish-pages.sh
# uploads before it starts this workflow. The data is not in git. By hand
# only, from main: `gh workflow run pages.yml --ref main`, or Actions, Pages,
# Run workflow. One-off setup (repo admin): Settings, Pages, Source: GitHub
# Actions.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release holding manifest.json, style.json and the archives
        required: false
        default: pages-data
        type: string

permissions:
  contents: read

# One deployment at a time; a queued one waits rather than cancelling a
# deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Fails here if Pages is not set to GitHub Actions in the settings.
      - id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          # Same Node as ci.yml, web/Dockerfile and the web-dev compose service.
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The base path is a build option only: local, nginx and dev builds
      # keep `/`. base_path is /erap-map-poc for this repo's site.
      - name: Build the app under the Pages base path
        working-directory: web
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base "${BASE_PATH}/"

      - name: Download the map data into dist/tiles/
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p web/dist/tiles
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir web/dist/tiles
          test -s web/dist/tiles/manifest.json
          test -s web/dist/tiles/style.json
          ls -l web/dist/tiles
          bytes=$(du -sb web/dist | cut -f1)
          echo "site: $bytes bytes"
          if [ "$bytes" -gt 1000000000 ]; then
            echo "The site is over the 1 GB GitHub Pages limit (ADR 0014)." >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
