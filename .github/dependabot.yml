version: 2
updates:
  # Keep GitHub Actions themselves up to date. Stack-agnostic; leave this in.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Web app dependencies. Minor and patch updates come as two grouped PRs
  # (runtime and dev); major updates come one PR each.
  - package-ecosystem: npm
    directory: '/web'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript is held at 6.x: typescript-eslint 8.72.1 supports
      # `typescript <6.1.0`. Drop this once typescript-eslint supports 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  # The pipeline's display config tool (ajv, the MapLibre style spec).
  # Keep @maplibre/maplibre-gl-style-spec on the same version as in web/.
  - package-ecosystem: npm
    directory: '/pipeline/style'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      style-tool:
        update-types: [minor, patch]

  # Base images in the Dockerfiles (GDAL, Node, nginx), pinned by tag and
  # digest in literal `FROM` lines. Keep them literal: Dependabot does not
  # resolve `ARG` values in `FROM`. Node appears in both Dockerfiles and
  # docker-compose.yml; keep the three on the same version.
  - package-ecosystem: docker
    directories:
      - '/pipeline'
      - '/web'
    schedule:
      interval: weekly
    commit-message:
      prefix: chore

  # Images named directly in docker-compose.yml (the web-dev Node image).
  # Keep it on the same Node version as web/Dockerfile.
  - package-ecosystem: docker-compose
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
